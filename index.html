    <style>
      :root {
        /* Default Dark Theme (Slate/Indigo) */
        --color-bg: 2 6 23;        /* #020617 */
        --color-surface: 15 23 42; /* #0f172a */
        --color-surface-highlight: 30 41 59; /* #1e293b */
        --color-accent: 99 102 241; /* #6366f1 */
        --color-accent-light: 129 140 248; /* #818cf8 */
        --color-text: 248 250 252; /* #f8fafc */
        --color-muted: 148 163 184; /* #94a3b8 */
        --color-border: 255 255 255; /* White (for glass borders) */
        
        --glass-bg: rgba(255, 255, 255, 0.03);
        --glass-border: rgba(255, 255, 255, 0.05);
        --glass-nav: rgba(2, 6, 23, 0.7);
        --noise-opacity: 0.15;
      }

      body.light-theme {
        /* Clean White Theme */
        --color-bg: 250 250 250;     /* #fafafa (Off-white) */
        --color-surface: 255 255 255; /* #ffffff */
        --color-surface-highlight: 241 245 249; /* #f1f5f9 */
        --color-accent: 79 70 229;    /* #4f46e5 (Indigo 600 - stronger for light mode) */
        --color-accent-light: 99 102 241; /* #6366f1 */
        --color-text: 15 23 42;       /* #0f172a (Slate 900 - Dark Text) */
        --color-muted: 100 116 139;   /* #64748b (Slate 500 - Darker muted) */
        --color-border: 0 0 0;        /* Black (for borders) */

        --glass-bg: rgba(255, 255, 255, 0.6);
        --glass-border: rgba(0, 0, 0, 0.05);
        --glass-nav: rgba(255, 255, 255, 0.85);
        --noise-opacity: 0.05;
      }

      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgb(var(--color-bg));
      }
      ::-webkit-scrollbar-thumb {
        background: rgb(var(--color-surface-highlight));
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgb(var(--color-muted));
      }
      
      body {
        background-color: rgb(var(--color-bg));
        color: rgb(var(--color-text));
        transition: background-color 0.5s ease, color 0.5s ease;
      }

      /* Dynamic Background Noise/Gradient */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image: 
          radial-gradient(at 0% 0%, rgba(99, 102, 241, var(--noise-opacity)) 0px, transparent 50%),
          radial-gradient(at 100% 100%, rgba(168, 85, 247, var(--noise-opacity)) 0px, transparent 50%);
        background-attachment: fixed;
        pointer-events: none;
        transition: opacity 0.5s ease;
      }
      
      .glass-panel {
        background: var(--glass-bg);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--glass-border);
        transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      }
      
      /* In light mode, add a subtle shadow to glass panels for depth */
      body.light-theme .glass-panel {
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      }

      .glass-nav {
        background: var(--glass-nav);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        transition: background 0.3s ease, border-color 0.3s ease;
      }

      /* Text Gradients that adapt */
      .text-gradient {
        background: linear-gradient(to right, rgb(var(--color-text)), rgb(var(--color-muted)));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .text-gradient-accent {
        background: linear-gradient(to right, rgb(var(--color-accent)), rgb(var(--color-accent-light)));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      
      .opacity-0-forced {
        opacity: 0 !important;
      }

      /* Helper utility to invert text on dark backgrounds in light mode if needed */
      .inverse-text {
        color: #f8fafc;
      }
    </style>
