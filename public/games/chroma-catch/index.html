<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chroma Catch</title>
  <link rel="stylesheet" href="tailwind.css" />

  <style>
    body {
      background-color: #13132b;
      /* Lighter background base */
      color: white;
      overflow: hidden;
      /* Prevent scrolling */
      touch-action: none;
      /* Prevent mobile zoom/scroll gestures */
      -webkit-font-smoothing: antialiased;
    }

    canvas {
      display: block;
    }

    /* Custom scrollbar for shop */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #101025;
    }

    ::-webkit-scrollbar-thumb {
      background: #333355;
      border-radius: 3px;
    }

    /* --- SCREEN FILTERS --- */

    /* 1. CRT Scanlines */
    .fx-crt {
      background: linear-gradient(rgba(18, 16, 16, 0) 50%,
          rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      pointer-events: none;
    }

    .fx-crt::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, 0.4) 100%);
      pointer-events: none;
    }

    /* 2. VHS Noise */
    .fx-vhs {
      mix-blend-mode: overlay;
      opacity: 0.3;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      pointer-events: none;
      animation: noiseShift 0.2s infinite;
    }

    @keyframes noiseShift {
      0% {
        transform: translate(0, 0)
      }

      25% {
        transform: translate(-2px, 2px)
      }

      50% {
        transform: translate(2px, -2px)
      }

      75% {
        transform: translate(-2px, -2px)
      }

      100% {
        transform: translate(2px, 2px)
      }
    }

    /* 3. Gameboy Dot Matrix */
    .fx-gb {
      background-color: #8bac0f;
      /* GB Green */
      mix-blend-mode: color;
      /* Tints everything green */
      opacity: 0.5;
      pointer-events: none;
    }

    .fx-gb-grid {
      background-image: radial-gradient(#0f380f 1px, transparent 1px);
      background-size: 4px 4px;
      opacity: 0.3;
      pointer-events: none;
    }

    /* 4. Noir B&W */
    .fx-bw {
      backdrop-filter: grayscale(100%) contrast(1.2);
      pointer-events: none;
    }

    /* 5. Night Vision */
    .fx-night {
      background-color: #00ff00;
      mix-blend-mode: color-dodge;
      opacity: 0.2;
      pointer-events: none;
    }

    .fx-night::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, transparent 40%, #000 120%);
      pointer-events: none;
    }
  </style>
